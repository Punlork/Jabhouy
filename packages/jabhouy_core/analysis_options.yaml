analyzer:
  errors:
    lines_longer_than_80_chars: ignore
  exclude:
    # Generated; its lints are the generator's to fix, not ours.
    - "**/*.g.dart"
include: package:very_good_analysis/analysis_options.6.0.0.yaml
linter:
  rules:
    # Matches the app so this package's extraction stays a pure move.
    # Worth turning back on once core has a hand-written public surface
    # beyond the Drift schema, whose column getters document themselves.
    public_member_api_docs: false
