name: jabhouy_ui
description: Shared Flutter presentation for Jabhouy — theme, assets, widgets and mixins with no feature or app dependency.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  bloc: ^9.2.1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.2.0
  image_picker: ^1.1.2
  jabhouy_l10n:
    path: ../jabhouy_l10n
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^6.0.0
