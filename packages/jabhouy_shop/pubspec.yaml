name: jabhouy_shop
description: The shop and category feature — the one feature promoted to its own package as a modularization experiment.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  drift: ^2.16.0
  dropdown_button2: ^2.3.9
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_keyboard_visibility: ^6.0.0
  flutter_slidable: ^3.1.2
  flutter_staggered_grid_view: ^0.7.0
  go_router: ^18.0.1
  image_picker: ^1.1.2
  jabhouy_core:
    path: ../jabhouy_core
  jabhouy_l10n:
    path: ../jabhouy_l10n
  jabhouy_net:
    path: ../jabhouy_net
  jabhouy_sync:
    path: ../jabhouy_sync
  jabhouy_ui:
    path: ../jabhouy_ui
  shimmer: ^3.0.0
  stream_transform: ^2.1.1
  transparent_image: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  sqlite3: ^2.9.4
  very_good_analysis: ^6.0.0
