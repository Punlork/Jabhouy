name: jabhouy
description: Shop management
version: 1.0.20+25
publish_to: none

workspace:
  - packages/jabhouy_core
  - packages/jabhouy_l10n
  - packages/jabhouy_net
  - packages/jabhouy_shop
  - packages/jabhouy_sync
  - packages/jabhouy_ui

